packages:
  - packages/*

# `ip-address` 10.1.0 has a moderate XSS advisory in its
# Address6 HTML-emitting methods (GHSA-v2v4-37r5-5v8g, patched in
# 10.1.1). It comes in as a transitive of @modelcontextprotocol/sdk
# → express-rate-limit. Pin to the patched range until the SDK ships
# an update that uses it directly.
overrides:
  ip-address: ">=10.1.1"

# pnpm 11 replaced the older `onlyBuiltDependencies` /
# `ignoredBuiltDependencies` arrays with a single `allowBuilds` map
# of `package: boolean`. `true` runs the package's install scripts;
# `false` explicitly acknowledges the script and skips it. Unlisted
# packages with build scripts are a hard install error in pnpm 11.
# When adding a dep that has a build script (the install error names
# them), add an entry here with the right boolean.
allowBuilds:
  # Native libffi binary used by cn-font-split for font subsetting.
  # cn-font-split is the JS shim; koffi is the FFI bridge that loads
  # the bundled .dylib/.so/.dll. Both must build together.
  cn-font-split: true
  koffi: true
  # esbuild and workerd ship native binaries for the runtime they
  # target (vite/wrangler bundling and Cloudflare worker dev).
  esbuild: true
  workerd: true
  # sharp and protobufjs ship native binaries we let pnpm fetch on
  # install. core-js's "build" is just a postinstall sponsorship
  # banner — harmless to run, but still has to be acknowledged.
  sharp: true
  protobufjs: true
  core-js: true
  # @parcel/watcher's prebuilt native fs-watcher is a perf
  # optimisation for sass file watching via vite; sass falls back
  # to a JS polling watcher when it's missing, which is fine for
  # both CI and our dev workflow.
  "@parcel/watcher": false
  # Playwright's postinstall downloads ~150 MB of Chromium. It's a
  # transitive dep (via @cloudflare/vitest-pool-workers); nothing
  # here needs Playwright's bundled browser, so skipping the
  # download is the right call. The Playwright MCP plugin used
  # during local development has its own browser install separate
  # from this package.
  playwright-chromium: false
