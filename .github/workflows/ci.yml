name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # https://stackoverflow.com/a/72408109
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions: {}

jobs:
  build-anipres:
    runs-on: ubuntu-latest
    # `pull-requests: write` so the measure-bundle-size action can update
    # the sticky comment; `actions: read` for cross-run baseline downloads.
    permissions:
      contents: read
      pull-requests: write
      actions: read
    defaults:
      run:
        working-directory: packages/anipres

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format --check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: packages/anipres/dist
          name: anipres-dist

      - name: Measure bundle size
        uses: ./.github/actions/measure-bundle-size
        with:
          key: anipres
          name: anipres
          input-path: packages/anipres/dist

  build-agent-core:
    needs: [build-anipres]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    defaults:
      run:
        working-directory: packages/agent-core

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anipres-dist
          path: packages/anipres/dist

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: packages/agent-core/dist
          name: agent-core-dist

      - name: Measure bundle size
        uses: ./.github/actions/measure-bundle-size
        with:
          key: agent-core
          name: agent-core
          input-path: packages/agent-core/dist

  test-slidev-addon-anipres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/slidev-addon-anipres

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format --check

      # - name: Test
      #   run: pnpm test

  build-slidev-addon-anipres-preview:
    needs: [test-slidev-addon-anipres, build-anipres]
    permissions:
      contents: read
      pull-requests: write
      actions: read
    defaults:
      run:
        working-directory: packages/slidev-addon-anipres

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest  # Run on Windows for testing the different path separator

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # https://github.com/KonghaYao/cn-font-split/issues/149
      - run: pnpm cn-font-split i default

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anipres-dist
          path: packages/anipres/dist

      - name: Build the sample slides for preview
        run: pnpm slidev build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          name: slidev-addon-anipres-dist
          path: packages/slidev-addon-anipres/dist/

      - name: Measure bundle size
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ./.github/actions/measure-bundle-size
        with:
          key: slidev-addon-anipres
          name: slidev-addon-anipres
          input-path: packages/slidev-addon-anipres/dist

  deploy-slidev-addon-anipres-preview:
    needs: [build-slidev-addon-anipres-preview]

    permissions:
      contents: read
      deployments: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slidev-addon-anipres-dist
          path: packages/slidev-addon-anipres/dist

      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/slidev-addon-anipres/dist --project-name=slidev-addon-anipres-preview --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  lint-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format --check

  test-worker:
    needs: [build-anipres, build-agent-core]

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anipres-dist
          path: packages/anipres/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-core-dist
          path: packages/agent-core/dist

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build-app:
    needs: [build-anipres, build-agent-core, lint-app]

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    defaults:
      run:
        working-directory: packages/app

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # https://github.com/KonghaYao/cn-font-split/issues/149
      - run: pnpm cn-font-split i default

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anipres-dist
          path: packages/anipres/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-core-dist
          path: packages/agent-core/dist

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-dist
          path: packages/app/dist/

      - name: Measure bundle size
        uses: ./.github/actions/measure-bundle-size
        with:
          key: app
          name: app
          input-path: packages/app/dist

  # Per-PR Pages deploy — UI smoke check at <branch>.anipres.pages.dev.
  # Pages production (anipres.app) is now served by the unified worker
  # (`deploy-worker` below), so this job is gated to PRs only.
  deploy-app:
    needs: [build-app]

    if: ${{ github.event_name == 'pull_request' }}

    permissions:
      contents: read
      deployments: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-dist
          path: packages/app/dist

      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/app/dist --project-name=anipres --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # Worker deploy — same code, two targets:
  # - on PR: shared preview worker (*.workers.dev, isolated D1/R2/DO,
  #   last push wins, see [env.preview] in wrangler.toml).
  # - on push to main: prod worker at anipres.app, bundles app/dist via
  #   the top-level [assets] binding and handles /api/* and /auth/*.
  # The per-PR Pages preview (`deploy-app` above) covers UI smoke checks;
  # the preview worker is for exercising auth + sync end-to-end.
  deploy-worker:
    needs: [build-anipres, build-agent-core, build-app, lint-app, test-worker]

    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}

    permissions:
      contents: read
      deployments: write
      pull-requests: write
      actions: read

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Need history back to the PR base to diff
          # `packages/worker/migrations/` for the reset gate below.
          # Only needed on the PR path; harmless on main pushes.
          # Quoted: GHA `&&`/`||` short-circuit like JS, and numeric `0`
          # is falsy, so `… && 0 || 1` always yields `1`. Strings `'0'`
          # / `'1'` are both truthy and pass through unchanged.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anipres-dist
          path: packages/anipres/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-core-dist
          path: packages/agent-core/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-dist
          path: packages/app/dist

      # Wrangler tracks applied D1 migrations by filename in the
      # internal `d1_migrations` table. If a migration file is edited
      # mid-review (or renamed, squashed), the next apply sees the tag
      # as done and silently skips the new contents — preview's schema
      # then drifts permanently from the file. When this PR's
      # `migrations/` differs from the base, wipe preview D1 first so
      # the subsequent `migrate:remote:preview` rebuilds from scratch.
      # Skipped on main pushes (preview isn't deployed there).
      - name: Reset preview D1 if migrations changed
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # `git diff --quiet` distinguishes the three outcomes by exit
        # code (0 unchanged, 1 changed, >1 error), so a real failure
        # surfaces instead of being silently routed to "skip reset" —
        # which `if git diff … | grep -q .` would do under `set -e`,
        # since `if` disables errexit for the condition.
        run: |
          set +e
          git diff --quiet "$BASE_SHA"...HEAD -- migrations/
          rc=$?
          set -e
          case "$rc" in
            0) echo "Migrations unchanged since $BASE_SHA — skipping preview D1 reset." ;;
            1) echo "Migrations changed since $BASE_SHA — resetting preview D1."
               pnpm reset:remote:preview ;;
            *) echo "git diff failed (exit $rc); refusing to deploy."
               exit "$rc" ;;
          esac

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `deploy:preview` / `deploy:prod` pass `--outdir dist` to
        # wrangler so this same step writes the deployed bundle to
        # disk for the measurement step below.
        run: pnpm ${{ github.event_name == 'pull_request' && 'deploy:preview' || 'deploy:prod' }}

      # CF Workers don't deploy sourcemaps by default, so drop them
      # before measuring — otherwise the report shows the sourcemap
      # weight (often 2× the JS) and looks broken.
      - name: Strip sourcemaps from worker bundle
        run: rm -f dist/*.map

      - name: Measure bundle size
        uses: ./.github/actions/measure-bundle-size
        with:
          key: worker
          name: worker
          input-path: packages/worker/dist

  release:
    needs: [build-anipres, test-slidev-addon-anipres, build-slidev-addon-anipres-preview]

    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}

    permissions:
      contents: write
      pull-requests: write
      id-token: write  # Required for OIDC, https://docs.npmjs.com/trusted-publishers#github-actions-configuration

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later is installed for trusted publishing
      - name: Update npm
        # Incremental upgrade of npm through 11.10.0 is needed
        # to avoid the error occurring when directly installing a later version of npm,
        # as reported in https://github.com/npm/cli/issues/9151
        run: |
          npm install -g npm@~11.10.0
          npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install

      # Download build artifacts to publish
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/anipres/dist
          name: anipres-dist

      # slidev-addon-anipres will be published without building

      - name: Package and Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
